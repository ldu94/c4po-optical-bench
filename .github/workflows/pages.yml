name: Test and publish Optical Bench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node tests/render-smoke.mjs --all
      - run: node tests/render-smoke.mjs --expanded
      - run: node tests/project-cad-smoke.mjs
      - run: node tests/project-cad-smoke.mjs --render --project=simple_example
      - run: node tests/project-cad-smoke.mjs --render --project=weebay_rack--rack_doublepass_aom
      - run: node tests/project-cad-smoke.mjs --render --project=satabs
      - run: node scripts/build-mount-scenes.mjs
      - run: git diff --exit-code cad/mount-scenes.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
